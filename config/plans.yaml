# Official documents for the knowledge base (spec §5.2).
#
# Plan PDFs are NEVER committed to this repository. `backend/scripts/ingest_plans.py
# --from-config` downloads each entry from its official source URL, records the file's
# SHA-256, edition year and source URL for every chunk, and ingests it page by page.
# Officers can also upload an official PDF from the app (Plans page, POST /api/plans).
#
# URLs located 2026-10-31. Status: "ingested" = downloaded and ingested successfully from
# the build sandbox; "located" = official URL found, host not reachable from the build
# sandbox (tnsdma.tn.gov.in was blocked there) — ingest it from the deployment.
#
# kind: district (DDMP) | city (city disaster management plan) | generic (NDMA guideline)

documents:
