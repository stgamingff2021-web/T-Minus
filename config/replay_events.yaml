# Replay events (spec §6.10). Configuration only: event names, places and the
# date ranges to evaluate. Every number in a replay result is fetched live from
# Open-Meteo's archive of forecasts AS ISSUED (Previous Runs API) and its
# reanalysis archive (ground truth) — nothing here is a forecast or an observation.
#
# as_of_*:    the replay clock steps from as_of_start to as_of_end every step_h hours;
#             at each step only forecasts issued at or before that time are used.
# truth_*:    window searched for the observed peak 24-h rainfall (ground truth).
# quiet_*:    a period of the same length used for the false-alarm check.

models:
  # Deterministic global models whose runs Open-Meteo archives as issued.
  # Multi-model agreement = share of these models exceeding the threshold (labelled
  # as such: it is NOT identical to a live ensemble probability).
  - ecmwf_ifs025
  - gfs_seamless
  - icon_seamless
  - gem_seamless
  - jma_seamless
  - meteofrance_seamless
  - ukmo_seamless
  - cma_grapes_global

events:
