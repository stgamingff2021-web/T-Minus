# Monitored districts (spec §5.3, §5.4).
#
# Configuration, not data: names, aliases and the coordinates of each district's
# representative monitor point (the district headquarters town) plus up to three
# points on major rivers. River coordinates are approximate river locations; the
# GloFAS client nudges them by +/-0.1 deg if the ~5 km grid cell is not on a
# modelled river (§8.1), and marks them "not on a modelled river" otherwise.
#
# Boundaries are NOT stored here: scripts/fetch_boundaries.py downloads them from
# their published source (OpenStreetMap via Overpass, or geoBoundaries) with provenance.
#
# Fields: id (slug), name (official), state, aliases (alternate spellings used in
# plans and feeds), hq [lat, lon], search_radius_km (facility search radius used
# only when no boundary polygon is loaded), rivers (optional).

defaults:
  search_radius_km: 25

states:
  TN: Tamil Nadu
  PY: Puducherry
  KL: Kerala
  AP: Andhra Pradesh
  OR: Odisha
  AS: Assam
  MH: Maharashtra

